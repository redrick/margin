<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>margin</title>
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="style.css">
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
</head>
<body>

<section id="workspace" class="screen">
  <aside id="side">
    <header class="side-head">
      <span class="brand">margin</span>
      <span class="spacer"></span>
      <button id="settings-btn" class="icon" title="Settings (ctrl+,)">⚙</button>
      <button id="hide-side" class="icon" title="Hide the sidebar ( \ )">⇤</button>
    </header>
    <button id="jump" class="jump" title="Go to a repository, worktree, branch or review">
      <span>Go to…</span><kbd>ctrl k</kbd>
    </button>
    <div id="side-scroll">
      <div class="side-sec" id="recent-sec">
        <div class="side-title">Reviews in progress</div>
        <div id="recent-reviews"></div>
      </div>
      <div class="side-sec">
        <div class="side-title">Repositories <span class="spacer"></span><button id="add-folder" class="icon small" title="Add a repository or a folder of repositories">＋</button></div>
        <input id="repo-filter" class="filter" placeholder="Filter repositories and worktrees">
        <nav id="repos"></nav>
      </div>
    </div>
    <footer class="side-foot"><button id="open-file" class="link-btn">Open a review file…</button></footer>
  </aside>

  <main id="main">
    <div id="welcome" class="welcome hidden">
      <div class="home-card">
        <h1>margin</h1>
        <p class="muted">Review git changes with an agent beside you.</p>
        <div id="welcome-body"></div>
        <div id="welcome-checks" class="start-checks"></div>
      </div>
    </div>

    <div id="home-pane" class="hidden">
      <header class="wt-head">
        <button id="show-side" class="icon hidden" title="Show the sidebar ( \ )">☰</button>
        <div class="titles">
          <div id="wt-crumbs" class="kicker"></div>
          <div id="wt-title" class="r-title" tabindex="-1"></div>
        </div>
        <label id="worktree-picker" class="small muted hidden">Worktree <select id="worktree-select"></select></label>
        <button id="back-review" class="small hidden" title="Back to the open review">Back to the review ⏎</button>
        <button id="wt-refresh" class="icon" title="Read git again (r)">↻</button>
      </header>
      <div id="wt-body"></div>
    </div>

    <div id="reviewer" class="hidden">
      <header id="review-head">
        <button id="toggle-picker" class="icon" title="Show or hide the sidebar ( \ )">☰</button>
        <button id="crumb" class="crumb" title="What else to review here (ctrl+k for anything)"></button>
        <div class="titles">
          <div id="r-kicker" class="kicker"></div>
          <div id="r-title" class="r-title"></div>
        </div>
        <div id="r-stats" class="muted small"></div>
        <button id="send-btn" class="small hidden" title="Send every draft comment to the agent (S)"></button>
        <button id="gh-btn" class="small hidden"></button>
        <button id="fix-btn" class="small hidden" title="Ask the agent to fix the problems you agreed with and the stops you said need changes (P)"></button>
        <button id="refresh" class="icon" title="Start the review over">↺</button>
        <button id="agent-link" class="small hidden">Link saved conversation</button>
        <button id="agent-btn" class="primary small">Start agent</button>
      </header>
      <div id="toolbar">
        <div id="walkthrough" class="toolbar-field hidden" data-overflow="grouping">
          <span id="walkthrough-label" class="toolbar-label">Group changes by</span>
          <div class="segments" role="group" aria-labelledby="walkthrough-label">
            <button id="walkthrough-file" type="button" aria-pressed="false" title="Browse the diff one changed file at a time">File by file</button>
            <button id="walkthrough-agent" type="button" aria-pressed="false" aria-describedby="walkthrough-status"><span id="walkthrough-progress" class="walkthrough-spinner hidden" aria-hidden="true"></span>Guided walk</button>
          </div>
          <span id="walkthrough-status" role="status"></span>
        </div>
        <div class="toolbar-field" data-overflow="display">
          <span id="display-label" class="toolbar-label">Display</span>
          <div id="reading-mode" class="segments" role="group" aria-labelledby="display-label">
            <button type="button" data-full="false" aria-pressed="false" title="Read one part of the current file or group at a time (w)">Step by step</button>
            <button id="reading-full" type="button" data-full="true" aria-pressed="false">Full group</button>
          </div>
        </div>
        <div class="toolbar-field comparison-option" data-overflow="layout">
          <span id="diff-layout-label" class="toolbar-label">Diff layout</span>
          <div id="diff-layout" class="segments" role="group" aria-labelledby="diff-layout-label">
            <button type="button" data-split="false" aria-pressed="true" title="Read the diff in one column (s)">Inline</button>
            <button type="button" data-split="true" aria-pressed="false" title="See old text on the left and new text on the right (s)">Split</button>
          </div>
        </div>
        <div class="toolbar-field" data-overflow="notes">
          <span id="notes-visibility-label" class="toolbar-label">Notes</span>
          <div id="notes-visibility" class="segments" role="group" aria-labelledby="notes-visibility-label">
            <button type="button" data-note-visibility="risky" aria-pressed="false" title="Show note cards and badges from high-risk stops (n)">Risky</button>
            <button type="button" data-note-visibility="all" aria-pressed="true" title="Show every note card and badge that matches the note filter (n)">All</button>
            <button type="button" data-note-visibility="hide" aria-pressed="false" title="Hide note cards and badges until you reveal them on the current stop (v)">Hide</button>
          </div>
        </div>
        <label class="toolbar-field note-filter-field" data-overflow="filter">
          <span class="toolbar-label">Filter notes</span>
          <span class="note-filter-control">
            <select id="note-filter" title="Choose which agent notes to show (F)"></select>
          </span>
        </label>
        <input id="search" class="search" placeholder="Search /" aria-label="Search review" data-overflow="search">
        <div id="toolbar-actions"></div>
        <button id="toolbar-more" class="tb" type="button" aria-expanded="false" aria-controls="toolbar-overflow">More</button>
        <div id="toolbar-overflow" role="group" aria-label="More review controls" inert></div>
      </div>
      <div id="review-body">
        <nav id="stations"></nav>
        <article id="station"></article>
      </div>
      <div id="testrun" class="hidden"></div>
      <div id="statusbar"></div>
      <div id="splitter" title="Drag to resize"></div>
      <section id="agent-pane">
        <header class="agent-head">
          <span class="dot" id="agent-dot"></span>
          <span id="agent-label">Agent not running</span>
          <span class="spacer"></span>
          <label class="submit-toggle" title="Off: messages for the agent are only typed, you press Enter yourself (margin open --no-submit)"><input id="agent-submit" type="checkbox" checked> send messages with Enter</label>
          <button id="agent-collapse" class="icon" title="Hide the agent">▾</button>
        </header>
        <div id="terminal"></div>
      </section>
    </div>
  </main>
</section>

<div id="switcher" class="switcher-back hidden">
  <div class="switcher">
    <input id="switch-q" placeholder="Repository, worktree, branch, review or command" autocomplete="off" spellcheck="false">
    <div id="switch-list"></div>
    <div class="switch-foot muted small">↑↓ move · enter open · esc close</div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="walkthrough-feedback" class="toast" role="status"></div>
<div id="question-alerts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
