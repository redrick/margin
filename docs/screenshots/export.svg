<circle cx="22" cy="19.0" r="6.5" fill="#ff5f57"/>
<circle cx="44" cy="19.0" r="6.5" fill="#febc2e"/>
<circle cx="66" cy="19.0" r="6.5" fill="#28c840"/>
<text x="496.0" y="24.0" text-anchor="middle" fill="#8b949e">margin export</text>
<text x="16.0" y="69" textLength="451.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"># Review: Stock reservations get an audit trail</text>
<text x="16.0" y="111" textLength="220.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">## What the change does</text>
<text x="16.0" y="153" textLength="960.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Adds an in-memory AuditLog that the store fills on every successful reservation, rejects quantities </text>
<text x="16.0" y="174" textLength="758.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">of zero or less before taking the lock, and makes the report skip zero entries.</text>
<text x="16.0" y="216" textLength="297.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">## Compared with what was asked</text>
<text x="16.0" y="258" textLength="960.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">The ask covers recording reservations only; the change also deletes ReleaseAll and sorts the report </text>
<text x="16.0" y="279" textLength="921.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">output, neither of which was asked for. The log lives in memory, so the history is gone after a </text>
<text x="16.0" y="300" textLength="499.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">restart, which may fall short of what support needs.</text>
<text x="16.0" y="342" textLength="105.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">## Comments</text>
<text x="16.0" y="384" textLength="806.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">- `inventory/stock.go:35`: Log the rejected quantity too, support will ask about it.</text>
<text x="16.0" y="426" textLength="960.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  &gt; Fixed: Reserve now records a rejected quantity in the log with a delta of 0, so support can see </text>
<text x="16.0" y="447" textLength="249.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">it. TestReserve covers it.</text>
<text x="16.0" y="489" textLength="115.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">## Decisions</text>
<text x="16.0" y="531" textLength="960.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">- [ ] Should a store without an audit log still be allowed, or should support always get a history? </text>
<text x="16.0" y="552" textLength="240.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">(`inventory/stock.go:21`)</text>
<text x="16.0" y="573" textLength="950.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">- [ ] The log keeps every entry in memory for the life of the process. Is that acceptable, or does </text>
<text x="16.0" y="594" textLength="384.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">it need a cap? (`inventory/audit.go:30`)</text>
</svg>
