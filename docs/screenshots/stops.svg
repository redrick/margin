<text x="332.8" y="279" textLength="96.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">  7  Tests</text>
<text x="44.8" y="300" textLength="873.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Reserve needs somewhere to record each reservation. Taking the log in the constructor makes</text>
