<rect x="16.0" y="54" width="1430.4" height="21" fill="#161b22"/>
<text x="16.0" y="69" textLength="230.4" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc" font-weight="bold"> margin › overview 0/7  </text>
<text x="246.4" y="69" textLength="19.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">◐◐</text>
<text x="265.6" y="69" textLength="19.2" lengthAdjust="spacingAndGlyphs" fill="#7d8590">○○</text>
<text x="284.8" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">◐</text>
<text x="313.6" y="69" textLength="355.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Stock reservations get an audit trail</text>
<text x="1168.0" y="69" textLength="278.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">  example · current/ vs base/</text>
<text x="16.0" y="90" textLength="576.0" lengthAdjust="spacingAndGlyphs" fill="#79c0ff"> ① Orient ─ walk ─ decide   then 5 stops, then your decision</text>
<text x="16.0" y="132" textLength="364.8" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc" font-weight="bold"> Stock reservations get an audit trail</text>
<text x="16.0" y="153" textLength="268.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> example · current/ vs base/</text>
<text x="16.0" y="195" textLength="1430.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> For        Record every reservation in an audit log. Support asked for a history of stock changes so they can explain a missing item. Reserve should</text>
<text x="16.0" y="216" textLength="739.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">            also refuse a zero or negative quantity instead of failing later.</text>
<text x="16.0" y="237" textLength="1392.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> Does       Adds an in-memory AuditLog that the store fills on every successful reservation, rejects quantities of zero or less before taking the</text>
<text x="16.0" y="258" textLength="547.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">            lock, and makes the report skip zero entries.</text>
<text x="16.0" y="279" textLength="1401.6" lengthAdjust="spacingAndGlyphs" fill="#d29922"> Gap        The ask covers recording reservations only; the change also deletes ReleaseAll and sorts the report output, neither of which was asked</text>
<text x="16.0" y="300" textLength="1200.0" lengthAdjust="spacingAndGlyphs" fill="#d29922">            for. The log lives in memory, so the history is gone after a restart, which may fall short of what support needs.</text>
<text x="16.0" y="342" textLength="297.6" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> The route · enter opens a stop</text>
<rect x="16.0" y="348" width="537.6" height="21" fill="#1f2a3a"/>
<text x="16.0" y="363" textLength="537.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" font-weight="bold">▸  1 ◐ low      18 lines  The store carries an audit log</text>
<text x="16.0" y="384" textLength="566.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">                         the store every later stop changes</text>
<text x="16.0" y="405" textLength="556.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">   2 ◐ medium   15 lines  Reserve validates before locking</text>
<text x="16.0" y="426" textLength="768.0" lengthAdjust="spacingAndGlyphs" fill="#7d8590">                         the method that calls the log, on the store from stop 1</text>
<text x="16.0" y="447" textLength="412.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">   3 ○ high     35 lines  The new audit log</text>
<text x="16.0" y="468" textLength="614.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">                         the log itself, which Reserve writes to</text>
<text x="16.0" y="489" textLength="422.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">   4 ○ low       7 lines  ReleaseAll is gone</text>
<text x="16.0" y="510" textLength="508.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590">                         independent; only a deletion</text>
<text x="16.0" y="531" textLength="480.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">   5 ◐ low      13 lines  Report skips zero deltas</text>
<text x="16.0" y="552" textLength="662.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">                         independent; the script that reads the stock</text>
<text x="16.0" y="594" textLength="268.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> 88 lines, about 13 minutes.</text>
<text x="16.0" y="636" textLength="585.6" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Before any code: does this change make sense, done this way?</text>
<text x="16.0" y="657" textLength="192.0" lengthAdjust="spacingAndGlyphs" fill="#3fb950">   ○ y  yes, walk it</text>
<text x="16.0" y="678" textLength="624.0" lengthAdjust="spacingAndGlyphs" fill="#ff7b71">   ○ n  no: say why; that is the review, and it blocks the change</text>
<text x="16.0" y="699" textLength="345.6" lengthAdjust="spacingAndGlyphs" fill="#d29922">   ○ ?  not sure yet, walk it anyway</text>
