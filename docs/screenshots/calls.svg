<text x="179.2" y="510" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#e6edf3">(</text>
<text x="947.2" y="510" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
