<text x="16.0" y="69" textLength="220.8" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc" font-weight="bold"> margin › reserve 2/7  </text>
<text x="236.8" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#3fb950">●</text>
<text x="246.4" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc">●</text>
<text x="256.0" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#3fb950">●</text>
<text x="265.6" y="69" textLength="19.2" lengthAdjust="spacingAndGlyphs" fill="#7d8590">○○</text>
<text x="304.0" y="69" textLength="240.0" lengthAdjust="spacingAndGlyphs" fill="#0d1117" font-weight="bold"> MEDIUM RISK  7/7 tested </text>
<text x="553.6" y="69" textLength="172.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> fix · 15 lines   </text>
<text x="726.4" y="69" textLength="307.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Reserve validates before locking</text>
<text x="1168.0" y="69" textLength="278.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">  example · current/ vs base/</text>
<text x="16.0" y="90" textLength="835.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" font-style="italic"> The quantity check moved in front of the mutex, and failures now say what was missing.</text>
<text x="947.2" y="90" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="111" textLength="921.6" lengthAdjust="spacingAndGlyphs" fill="#d29922"> medium risk: every reservation goes through it, and it now calls into the log while holding the</text>
<text x="947.2" y="111" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="132" textLength="105.6" lengthAdjust="spacingAndGlyphs" fill="#d29922"> store lock</text>
<text x="947.2" y="132" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="947.2" y="153" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="174" textLength="211.2" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Why a stop of its own</text>
<text x="947.2" y="174" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="195" textLength="883.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">This is the only function whose behaviour changes for existing callers, so it gets a stop of</text>
<text x="947.2" y="195" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="216" textLength="537.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">its own, read right after the constructor it depends on.</text>
<text x="947.2" y="216" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="237" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> What it does and how</text>
<text x="947.2" y="237" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="258" textLength="864.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Reserve now rejects a quantity of zero or less before it takes the lock. Under the lock it</text>
<text x="947.2" y="258" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="279" textLength="249.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">reads the stock once into </text>
<text x="294.4" y="279" textLength="86.4" lengthAdjust="spacingAndGlyphs" fill="#ffa657">available</text>
<text x="380.8" y="279" textLength="220.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">, fails with a wrapped </text>
<text x="601.6" y="279" textLength="144.0" lengthAdjust="spacingAndGlyphs" fill="#ffa657">ErrInsufficient</text>
<text x="745.6" y="279" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> that says how</text>
<text x="947.2" y="279" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="300" textLength="816.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">much was there, and otherwise takes the stock and records the reservation in the log.</text>
<text x="947.2" y="300" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="321" textLength="38.4" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Why</text>
<text x="947.2" y="321" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="342" textLength="864.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">A bad request used to wait for the lock before failing, and the old error did not say what</text>
<text x="947.2" y="342" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="363" textLength="873.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">was missing. Recording under the lock keeps the log in the same order as the stock changes.</text>
<text x="947.2" y="363" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="947.2" y="384" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="405" textLength="384.0" lengthAdjust="spacingAndGlyphs" fill="#3fb950"> tests: TestReserve, TestAuditLogRecords</text>
<text x="947.2" y="405" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="947.2" y="426" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="447" textLength="931.2" lengthAdjust="spacingAndGlyphs" fill="#79c0ff">── inventory/stock.go · Store.Reserve · 30–44 · +9 -3 ───────────────────────────────────────────</text>
<text x="947.2" y="447" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="468" textLength="729.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590" font-style="italic">The whole of Reserve, since the check, the error and the log call all moved.</text>
<text x="947.2" y="468" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
