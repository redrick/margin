<text x="16.0" y="69" textLength="220.8" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc" font-weight="bold"> margin › reserve 2/7  </text>
<text x="236.8" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">◐</text>
<text x="246.4" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#f0f6fc">●</text>
<text x="256.0" y="69" textLength="19.2" lengthAdjust="spacingAndGlyphs" fill="#7d8590">○○</text>
<text x="275.2" y="69" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">◐</text>
<text x="304.0" y="69" textLength="240.0" lengthAdjust="spacingAndGlyphs" fill="#0d1117" font-weight="bold"> MEDIUM RISK  7/7 tested </text>
<text x="553.6" y="69" textLength="172.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> fix · 15 lines   </text>
<text x="726.4" y="69" textLength="307.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Reserve validates before locking</text>
<text x="1168.0" y="69" textLength="278.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590">  example · current/ vs base/</text>
<text x="44.8" y="90" textLength="864.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">Reserve now rejects a quantity of zero or less before it takes the lock. Under the lock it</text>
<text x="947.2" y="90" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="90" textLength="249.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> ✎ try a change · vim keys</text>
<text x="44.8" y="111" textLength="249.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">reads the stock once into </text>
<text x="294.4" y="111" textLength="86.4" lengthAdjust="spacingAndGlyphs" fill="#ffa657">available</text>
<text x="380.8" y="111" textLength="220.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">, fails with a wrapped </text>
<text x="601.6" y="111" textLength="144.0" lengthAdjust="spacingAndGlyphs" fill="#ffa657">ErrInsufficient</text>
<text x="745.6" y="111" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9"> that says how</text>
<text x="947.2" y="111" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="44.8" y="132" textLength="816.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">much was there, and otherwise takes the stock and records the reservation in the log.</text>
<text x="947.2" y="132" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="132" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> i a I A o O   insert</text>
<text x="16.0" y="153" textLength="38.4" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Why</text>
<text x="947.2" y="153" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="153" textLength="278.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> esc           back to normal</text>
<text x="44.8" y="174" textLength="864.0" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">A bad request used to wait for the lock before failing, and the old error did not say what</text>
<text x="947.2" y="174" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="174" textLength="278.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> h j k l w b e 0 ^ $ gg G f t</text>
<text x="44.8" y="195" textLength="873.6" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">was missing. Recording under the lock keeps the log in the same order as the stock changes.</text>
<text x="947.2" y="195" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="195" textLength="297.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> x dd D C cc cw dw ciw di( yy p</text>
<text x="947.2" y="216" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="216" textLength="355.2" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> v V           select, then d c y &gt; &lt;</text>
<text x="16.0" y="237" textLength="384.0" lengthAdjust="spacingAndGlyphs" fill="#3fb950"> tests: TestReserve, TestAuditLogRecords</text>
<text x="947.2" y="237" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="237" textLength="316.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> u ctrl+r .    undo, redo, repeat</text>
<text x="947.2" y="258" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="258" textLength="316.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> &gt; &lt; J ~ r     indent, join, case</text>
<text x="16.0" y="279" textLength="163.2" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Around this stop</text>
<text x="947.2" y="279" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="300" textLength="691.2" lengthAdjust="spacingAndGlyphs" fill="#d29922">   func Reserve, changed (stock.go:31): 5 outside the tour · enter peeks</text>
<text x="947.2" y="300" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="300" textLength="364.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> :w  ctrl+s    run the tests with this</text>
<text x="16.0" y="321" textLength="758.4" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">      inventory/stock_test.go:13  if err := s.Reserve("apple", 2); err != nil {</text>
<text x="947.2" y="321" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="321" textLength="201.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> :q            cancel</text>
<text x="16.0" y="342" textLength="931.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">      inventory/stock_test.go:19  if err := s.Reserve("apple", 0); !errors.Is(err, ErrInvalidQuan</text>
<text x="947.2" y="342" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="363" textLength="931.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">      inventory/stock_test.go:26  if err := s.Reserve("pear", 2); !errors.Is(err, ErrInsufficient</text>
<text x="947.2" y="363" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="363" textLength="297.6" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> the tests run unchanged first,</text>
<text x="16.0" y="384" textLength="748.8" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">      inventory/stock_test.go:29  if err := s.Reserve("pear", 1); err != nil {</text>
<text x="947.2" y="384" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="384" textLength="316.8" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> then with your edit in the file;</text>
<text x="16.0" y="405" textLength="739.2" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9">      inventory/stock_test.go:40  if err := s.Reserve("fig", 2); err != nil {</text>
<text x="947.2" y="405" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="405" textLength="326.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> margin puts the lines back after.</text>
<text x="16.0" y="426" textLength="604.8" lengthAdjust="spacingAndGlyphs" fill="#3fb950">   func ReleaseAll, removed (stock.go:45): nothing else uses it</text>
<text x="947.2" y="426" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="956.8" y="426" textLength="326.4" lengthAdjust="spacingAndGlyphs" fill="#7d8590"> an empty block deletes the lines.</text>
<text x="947.2" y="447" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="468" textLength="931.2" lengthAdjust="spacingAndGlyphs" fill="#79c0ff">── inventory/stock.go · Store.Reserve · 30–44 · +9 -3 ───────────────────────────────────────────</text>
