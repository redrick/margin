<text x="947.2" y="279" textLength="9.6" lengthAdjust="spacingAndGlyphs" fill="#161b22">│</text>
<text x="16.0" y="300" textLength="700.8" lengthAdjust="spacingAndGlyphs" fill="#79c0ff" font-weight="bold"> Still open · enter ticks a call, ? agrees with a problem, x dismisses it</text>
